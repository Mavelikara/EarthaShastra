<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <style>
    body{margin:0;background:#e5e2dc;font-family:system-ui,sans-serif}
    .frame-label{position:absolute;top:-40px;left:0;font-size:20px;font-weight:700;color:#2a2a28;background:#fff;padding:6px 16px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
    .frame{position:absolute;width:1160px;background:#fff;box-shadow:0 8px 40px rgba(0,0,0,.18);border-radius:4px;overflow:hidden}
    .frame iframe{width:100%;border:0;display:block;height:1200px}
  </style>
</helmet>

<section id="1a" style="position:absolute;left:0;top:80px">
  <div class="frame-label">1a — Organic</div>
  <div class="frame">
    <iframe data-src="home-organic.html" loading="lazy" title="Organic direction" ref="{{ setFrameA }}"></iframe>
  </div>
</section>

<section id="1b" style="position:absolute;left:1240px;top:80px">
  <div class="frame-label">1b — Classical</div>
  <div class="frame">
    <iframe data-src="home-classical.html" loading="lazy" title="Classical direction" ref="{{ setFrameB }}"></iframe>
  </div>
</section>

<section id="1c" style="position:absolute;left:2480px;top:80px">
  <div class="frame-label">1c — Modernist</div>
  <div class="frame">
    <iframe data-src="home-modernist.html" loading="lazy" title="Modernist direction" ref="{{ setFrameC }}"></iframe>
  </div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  init(iframe, delay) {
    if (!iframe || iframe.dataset.init) return;
    iframe.dataset.init = '1';
    iframe.addEventListener('load', () => {
      try {
        const doc = iframe.contentDocument;
        if (doc && doc.body) iframe.style.height = doc.body.scrollHeight + 'px';
      } catch (e) {}
    }, { once: true });
    setTimeout(() => { iframe.src = iframe.dataset.src; }, delay);
  }
  renderVals() {
    return {
      setFrameA: (el) => this.init(el, 0),
      setFrameB: (el) => this.init(el, 600),
      setFrameC: (el) => this.init(el, 1200),
    };
  }
}

</script>
</body>
</html>
